<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sakura & Erii // THE WORLD IS GENTLE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;500&family=Noto+Serif+SC:wght@300;500;700&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-blue: #2400ff;
            --neon-red: #e60023;
            --sakura-pink: #ffb7c5;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #010102;
            font-family: 'Rajdhani', sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        #gl-canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* 氛围暗角 */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 35%, rgba(0,5,10,0.5) 70%, #000000 100%);
            z-index: 5; pointer-events: none;
            mix-blend-mode: multiply;
        }

        #status-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; box-sizing: border-box; z-index: 50;
            font-family: 'Orbitron', sans-serif; font-size: 12px; pointer-events: none;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .blink { animation: blinker 3s ease-in-out infinite; }
        @keyframes blinker { 0%,100% { opacity: 0.3; } 50% { opacity: 1; text-shadow: 0 0 10px white; } }

        #cinema-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 40; pointer-events: none;
        }

        #countdown-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 260px;
            font-weight: 100;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 0 80px var(--neon-cyan);
            letter-spacing: 20px;
            transition: opacity 0.3s, transform 0.2s;
            opacity: 0;
            mix-blend-mode: screen;
        }

        #subtitle {
            position: absolute;
            bottom: 12%; 
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 2px 2px 0px rgba(255,0,0,0.3), -2px -2px 0px rgba(0,255,255,0.3);
            letter-spacing: 6px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 60;
            width: 100%;
        }
        #subtitle.visible { opacity: 1; transform: translateY(0); }
        
        #subtitle.rose-mode { color: #ffe6e6; text-shadow: 0 0 30px var(--neon-red); font-size: 32px; }
        #subtitle.heart-mode { color: #ffffff; font-size: 42px; font-style: italic; font-weight: 700; text-shadow: 0 0 30px var(--neon-blue), 0 0 60px var(--neon-cyan); letter-spacing: 8px; }

        /* === 记忆弹幕容器（全屏覆盖，但内部元素会避让） === */
        #danmu-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 20; 
        }
        
        /* === 优化后的记忆文本样式 === */
        .memory-text {
            position: absolute;
            font-family: 'Noto Serif SC', serif;
            /* 降低基础透明度，增加孤寂感 */
            color: rgba(255, 255, 255, 0.85); 
            font-weight: 300;
            white-space: nowrap;
            opacity: 0;
            /* 左侧加一个极细的装饰线，像书签或胶片边缘 */
            border-left: 1px solid rgba(255,255,255,0.4);
            padding-left: 12px;
            /* 混合模式让文字像光一样叠加 */
            mix-blend-mode: hard-light;
            will-change: transform, opacity, filter;
        }
        
        /* 缓慢的深海沉浮动画 */
        @keyframes deepDrift {
            0% { 
                opacity: 0; 
                transform: translateY(30px) translateX(0); 
                filter: blur(5px); 
            }
            15% { 
                opacity: 0.9; 
                transform: translateY(0) translateX(5px); 
                filter: blur(0px); 
            }
            85% { 
                opacity: 0.7; 
                transform: translateY(-20px) translateX(10px); 
                filter: blur(1px); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(-40px) translateX(15px); 
                filter: blur(8px); 
            }
        }

        /* 蓄力环 */
        .charge-ring {
            position: absolute;
            width: 320px; height: 320px;
            border: 1px solid rgba(255,255,255,0.05);
            border-top: 2px solid var(--neon-red);
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
            border-bottom: 2px solid var(--neon-cyan);
            border-radius: 50%;
            opacity: 0;
            visibility: hidden; 
            transition: opacity 0.3s;
            box-shadow: 0 0 60px rgba(200, 0, 50, 0.1);
        }
        .charge-ring.active {
            visibility: visible;
            opacity: 1;
            animation: spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #guide-hint {
            position: absolute; bottom: 4%;
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: opacity 0.5s;
        }

        #cam-preview {
            position: absolute; bottom: 20px; right: 20px; width: 120px; height: 90px;
            background: #000; border: 1px solid rgba(255,255,255,0.1); opacity: 0.2; z-index: 10; transform: scaleX(-1);
            border-radius: 2px;
            transition: opacity 0.3s;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 30;
            transition: opacity 0.3s;
            opacity: 0;
        }
        .crosshair-svg circle { transition: all 0.3s; }
        .state-pinch .center-dot { fill: var(--neon-cyan); r: 4; }
        .state-pinch .outer-ring { opacity: 0; r: 15; }
        .state-open .outer-ring { stroke: var(--neon-red); stroke-dasharray: 2, 4; animation: spin 4s linear infinite; opacity: 0.8; r: 30; stroke-width: 1; }

        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div style="color:var(--neon-red); font-family:'Orbitron'; letter-spacing: 6px; font-size: 14px;">LOADING NIBELUNGEN...</div>
    </div>

    <div id="vignette"></div>

    <div id="status-bar">
        <div><span style="color:var(--neon-red)">ARCHIVE: BLACK MOON</span> <span id="fps-counter" style="color:#555">FPS: 60</span></div>
        <div class="blink"><span id="gesture-state" style="color:#888">SCANNING</span></div>
    </div>

    <div id="cinema-layer">
        <div id="countdown-container" style="position:relative; display:flex; justify-content:center; align-items:center;">
            <div class="charge-ring" id="ring-element"></div>
            <div id="countdown-num">-</div>
        </div>
        <div id="subtitle"></div>
        <div id="guide-hint">1: Summon / Open: Scatter / Fist: Love</div>
    </div>

    <div id="danmu-container"></div>

    <canvas id="cam-preview"></canvas>
    <canvas id="gl-canvas"></canvas>

    <div id="crosshair">
        <svg width="60" height="60" viewBox="0 0 60 60" class="crosshair-svg">
            <circle class="center-dot" cx="30" cy="30" r="2" fill="white" />
            <circle class="outer-ring" cx="30" cy="30" r="15" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
        </svg>
    </div>

    <video id="webcam" style="display:none;" autoplay playsinline></video>

    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.160.0';
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/+esm';

        // --- Config ---
        const CONFIG = {
            particleCount: 22000, 
            pixelRatio: Math.min(window.devicePixelRatio, 1.5),
            pinchThresholdIn: 0.08,
            pinchThresholdOut: 0.15,
            openThreshold: 0.28,
            cameraFov: 50 
        };

        const STAGE = {
            INTRO: 0, ROSE: 1, CHAOS: 2, HEART: 3     
        };

        const STATE = {
            currentStage: STAGE.INTRO,
            currentShape: 'ChaosNebula',
            handPos: { x: 0, y: 0 },
            fingerCount: 0,
            stableFingerCount: 0,
            debounceTimer: 0,
            summonTimer: 0,
            time: 0,
            rotationVelocity: { x: 0, y: 0 }
        };

        const MEMORIES = [
            "我们都是小怪兽，有一天会被正义的奥特曼杀死", "04.24，和Sakura去东京天空树", "世界很温柔", "如果是Sakura的话，可以哦",
            "玩具修理好了", "凡王之血，必以剑终", "想去外面看看", "不要死...", "我喜欢这样的世界", "Ex-Erii", "Kii-Kii",
            "正义的朋友", "很遗憾，没能一起去...", "这是书上写的...", "哥哥...", "东京的天空树", "明治神宫的婚礼",
            "红白机的游戏手柄", "深海的呼唤", "Sakura...", "再见...", "小黄鸭", "日落...好美", "Sakura，再见",
            "这就是外面的世界吗", "想要...一直在一起", "我是怪兽...", "你来了...", "好想去", "没有了...", "都要好好的",
            "红色的裙摆", "谁来救救我", "Sakura，这里好冷", "只有我们两个人", "你是我的...", "不要丢下我"
        ];

        // --- Three.js Setup ---
        const canvas = document.getElementById('gl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.025);

        const camera = new THREE.PerspectiveCamera(CONFIG.cameraFov, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 11); 

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, powerPreference: "high-performance", antialias: false, alpha: false });
        renderer.setPixelRatio(CONFIG.pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        // --- Particles ---
        function createParticleTexture() {
            const size = 64; const cvs = document.createElement('canvas'); cvs.width = size; cvs.height = size;
            const ctx = cvs.getContext('2d');
            const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)'); grad.addColorStop(0.15, 'rgba(255, 255, 255, 0.9)'); 
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)'); grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(cvs);
        }

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(CONFIG.particleCount * 3);
        const targetPositions = new Float32Array(CONFIG.particleCount * 3);
        const chaosPositions = new Float32Array(CONFIG.particleCount * 3);
        const colors = new Float32Array(CONFIG.particleCount * 3);
        const randoms = new Float32Array(CONFIG.particleCount);

        for (let i = 0; i < CONFIG.particleCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 50;
            positions[i3+1] = (Math.random() - 0.5) * 50;
            positions[i3+2] = (Math.random() - 0.5) * 50;
            randoms[i] = Math.random();
            const v = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
            chaosPositions[i3] = v.x * (20 + Math.random()*30);
            chaosPositions[i3+1] = v.y * (20 + Math.random()*30);
            chaosPositions[i3+2] = v.z * (20 + Math.random()*30);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const particlesMesh = new THREE.Points(geometry, new THREE.PointsMaterial({
            size: 0.12, map: createParticleTexture(), vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85
        }));
        const particleGroup = new THREE.Group(); particleGroup.add(particlesMesh); scene.add(particleGroup);

        // --- Shapes ---
        const Shapes = {
            ChaosNebula: (i, count) => {
                const r = 6 + Math.random() * 4; const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1);
                return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi) };
            },
            SolidRose: (i, count) => {
                const stemLimit = 0.10; const leafLimit = 0.25; const calyxLimit = 0.30; const tGlobal = i / count;
                if (tGlobal < stemLimit) {
                    const t = tGlobal / stemLimit; const y = -4.0 + t * 4.5; const r = 0.08 * Math.sqrt(Math.random()) * (1 - t*0.3); const theta = Math.random() * Math.PI * 2; const bendX = 0.3 * Math.sin(y * 0.8); const bendZ = 0.1 * Math.cos(y * 1.0);
                    return { x: bendX + r * Math.cos(theta), y: y, z: bendZ + r * Math.sin(theta) };
                } else if (tGlobal < leafLimit) {
                    const t = (tGlobal - stemLimit) / (leafLimit - stemLimit); const isLeaf1 = t < 0.5; const lt = isLeaf1 ? t * 2 : (t - 0.5) * 2; const shapeW = Math.sin(lt * Math.PI); const wRandom = (Math.random() - 0.5) * shapeW * 1.0; const thickRandom = (Math.random() - 0.5) * 0.05; const lLen = lt * 2.5; const attachY = isLeaf1 ? -2.0 : -1.0; const stemOffsetX = 0.3 * Math.sin(attachY * 0.8); const stemOffsetZ = 0.1 * Math.cos(attachY * 1.0); const lx = lLen; const lz = wRandom; const ly = lt * 0.5 + thickRandom; const rotY = isLeaf1 ? 0.8 : -2.5; const tilt = 0.4; const cosA = Math.cos(rotY), sinA = Math.sin(rotY);
                    return { x: (lx * cosA - lz * sinA) + stemOffsetX, y: (attachY + lx * tilt + ly), z: (lx * sinA + lz * cosA) + stemOffsetZ };
                } else if (tGlobal < calyxLimit) {
                    const t = (tGlobal - leafLimit) / (calyxLimit - leafLimit); const y = 0.5 + t * 0.4; const maxR = 0.08 + t * 0.3; const r = maxR * Math.sqrt(Math.random()); const theta = Math.random() * Math.PI * 2; const stemTopX = 0.3 * Math.sin(0.5 * 0.8); const stemTopZ = 0.1 * Math.cos(0.5 * 1.0);
                    return { x: stemTopX + r * Math.cos(theta), y: y, z: stemTopZ + r * Math.sin(theta) };
                } else {
                    const t = (tGlobal - calyxLimit) / (1 - calyxLimit); const theta = i * 2.39996; const rBase = Math.pow(t, 0.5) * 2.0; const petalWave = Math.sin(2.5 * theta + t*3.0); const spread = 0.1 + t * 0.3; const rJitter = (Math.random() - 0.5) * spread; const yJitter = (Math.random() - 0.5) * spread; const r = rBase + petalWave * (0.2 + t * 0.4) + rJitter; let y = 0.8 + Math.pow(t, 0.8) * 2.5; const curl = t > 0.4 ? Math.pow(t - 0.4, 2) * 1.5 : 0; y -= curl * Math.cos(theta * 2.5); y += yJitter; const stemTopX = 0.3 * Math.sin(0.5 * 0.8); const stemTopZ = 0.1 * Math.cos(0.5 * 1.0);
                    return { x: stemTopX + r * Math.cos(theta), y: y, z: stemTopZ + r * Math.sin(theta) };
                }
            },
            CrystalHeart: (i, count) => {
                if (i < count * 0.1) {
                    const theta = Math.random() * Math.PI * 2; const r = 2.5 + Math.random() * 3.5; 
                    return { x: r * Math.cos(theta), y: -2.0 + (Math.random() - 0.5) * 0.1, z: r * Math.sin(theta) };
                } else {
                    let x, y, z, found=false;
                    while (!found) {
                        x = (Math.random() - 0.5) * 3.2; y = (Math.random() - 0.5) * 3.2; z = (Math.random() - 0.5) * 3.2;
                        const a = x, b = y, c = z; const p = a*a + 2.25*b*b + c*c - 1;
                        if (p*p*p - a*a*c*c*c - 0.1125*b*b*c*c*c <= 0) found = true;
                    }
                    const scale = 1.6; return { x: x * scale, y: z * scale + 0.5, z: y * scale };
                }
            }
        };

        function setTargetShape(name) {
            const func = Shapes[name] || Shapes['ChaosNebula'];
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const pos = func(i, CONFIG.particleCount);
                targetPositions[i*3] = pos.x; targetPositions[i*3+1] = pos.y; targetPositions[i*3+2] = pos.z;
            }
            STATE.currentShape = name;
        }
        setTargetShape('ChaosNebula'); 

        // --- Danmu Sanctuary System (Anti-Overlap) ---
        const danmuContainer = document.getElementById('danmu-container');
        let memoryBag = [...MEMORIES];

        // 维护左右两侧的垂直槽位 (0-100%)，用于防止重叠
        // 将屏幕高度划分为 15 个槽位
        const SLOTS_COUNT = 15;
        const leftSlots = new Array(SLOTS_COUNT).fill(0); // 0 = 空闲, >0 = 剩余占用时间(ms)
        const rightSlots = new Array(SLOTS_COUNT).fill(0);

        function getNextMemory() {
            if (memoryBag.length === 0) memoryBag = [...MEMORIES];
            return memoryBag.splice(Math.floor(Math.random() * memoryBag.length), 1)[0];
        }

        function updateSlots(dt) {
            for(let i=0; i<SLOTS_COUNT; i++) {
                if(leftSlots[i] > 0) leftSlots[i] -= dt;
                if(rightSlots[i] > 0) rightSlots[i] -= dt;
            }
        }

        function spawnDanmu() {
            if (STATE.currentStage !== STAGE.HEART) return;
            
            // 决定左右侧
            const isLeft = Math.random() > 0.5;
            const slots = isLeft ? leftSlots : rightSlots;
            
            // 寻找空闲槽位
            // 我们不希望太靠上或太靠下，所以只在 index 2 到 12 之间找
            const validIndices = [];
            for (let i = 2; i < SLOTS_COUNT - 3; i++) {
                if (slots[i] <= 0) validIndices.push(i);
            }
            
            if (validIndices.length === 0) return; // 没有空位，放弃生成，防止重叠

            // 随机选一个空位
            const slotIndex = validIndices[Math.floor(Math.random() * validIndices.length)];
            
            // 占用该槽位 (设置占用时间，比如 6秒后释放，虽然动画很长，但只要错开一段距离即可)
            slots[slotIndex] = 6000; 

            // 生成 DOM
            const text = document.createElement('div');
            text.className = 'memory-text';
            text.textContent = getNextMemory();
            
            // 计算坐标
            // 左侧区域：5% - 25% | 右侧区域：75% - 95% (严格避让中间)
            const xPos = isLeft ? (5 + Math.random() * 20) : (75 + Math.random() * 20);
            
            // 将槽位映射为百分比高度 (每槽位 ~6.6%)
            // 加上一点随机偏移，避免看起来像表格一样整齐
            const yBase = (slotIndex / SLOTS_COUNT) * 100;
            const yOffset = (Math.random() - 0.5) * 4; 
            const yPos = yBase + yOffset;

            text.style.left = xPos + '%';
            text.style.top = yPos + '%';
            
            // 随机景深和大小
            const depth = Math.random(); 
            // 字体稍小更显精致，11px - 20px
            text.style.fontSize = (11 + depth * 9) + 'px'; 
            // 越小的字越模糊（远景），越大的字越清晰
            const blurAmount = (1 - depth) * 3;
            text.style.filter = `blur(${blurAmount}px)`;
            text.style.zIndex = Math.floor(depth * 50);

            // 动画时间：越远（字小）越慢，增加视差感
            const duration = 12 + (1-depth) * 8; // 12s - 20s
            text.style.animationDuration = duration + 's';
            text.style.animationName = 'deepDrift'; // 应用新的沉浮动画
            
            danmuContainer.appendChild(text);
            
            // 清理 DOM
            setTimeout(() => { if(text.parentNode) text.remove(); }, duration * 1000);
        }

        setInterval(() => {
            updateSlots(300); // 更新槽位计时器
            spawnDanmu();
        }, 300); // 尝试生成频率

        // --- UI Updates ---
        const countLabel = document.getElementById('countdown-num');
        const subtitle = document.getElementById('subtitle');
        const ringElement = document.getElementById('ring-element');
        const guideHint = document.getElementById('guide-hint');

        function updateUI() {
            subtitle.className = ''; subtitle.textContent = '';
            if (STATE.currentStage === STAGE.INTRO) {
                countLabel.style.opacity = 1; guideHint.style.opacity = 1;
            } else if (STATE.currentStage === STAGE.ROSE) {
                countLabel.style.opacity = 0; subtitle.textContent = "Show me the flowers";
                subtitle.classList.add('visible', 'rose-mode'); guideHint.style.opacity = 0;
            } else if (STATE.currentStage === STAGE.CHAOS) {
                subtitle.classList.remove('visible');
            } else if (STATE.currentStage === STAGE.HEART) {
                subtitle.textContent = "Sakura最好了";
                subtitle.classList.add('visible', 'heart-mode');
            }
        }

        // --- Vision & Loop ---
        const video = document.getElementById('webcam');
        const camCtx = document.getElementById('cam-preview').getContext('2d');
        const crosshair = document.getElementById('crosshair');
        const stateLabel = document.getElementById('gesture-state');
        let handLandmarker = null, lastVideoTime = -1;

        async function setupVision() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" },
                    runningMode: "VIDEO", numHands: 1
                });
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => { document.getElementById('loader').style.display = 'none'; predict(); });
            } catch (err) { document.getElementById('loader').innerHTML = `ERR: ${err.message}`; }
        }

        function countFingers(lm) {
            const wrist = lm[0]; let count = 0;
            [[8,6], [12,10], [16,14], [20,18]].forEach(indices => {
                const tip = lm[indices[0]]; const pip = lm[indices[1]];
                if (Math.hypot(tip.x - wrist.x, tip.y - wrist.y) > Math.hypot(pip.x - wrist.x, pip.y - wrist.y) * 1.02) count++;
            });
            const thumbTip = lm[4]; const pinkyMCP = lm[17]; const thumbIP = lm[3];
            const tipDist = Math.hypot(thumbTip.x - pinkyMCP.x, thumbTip.y - pinkyMCP.y);
            const ipDist = Math.hypot(thumbIP.x - pinkyMCP.x, thumbIP.y - pinkyMCP.y);
            if (tipDist > ipDist * 1.05) count++; return count;
        }

        async function predict() {
            if (!handLandmarker) return;
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                camCtx.drawImage(video, 0, 0, 300, 150);
                const res = handLandmarker.detectForVideo(video, performance.now());
                
                if (res.landmarks.length > 0) {
                    const lm = res.landmarks[0];
                    const cx = (lm[5].x + lm[9].x)/2, cy = (lm[5].y + lm[9].y)/2;
                    STATE.handPos.x = (1-cx) * window.innerWidth;
                    STATE.handPos.y = cy * window.innerHeight;
                    crosshair.style.left = STATE.handPos.x + 'px'; crosshair.style.top = STATE.handPos.y + 'px';
                    crosshair.style.opacity = 1;

                    const fingers = countFingers(lm);
                    if (fingers === STATE.fingerCount) {
                        STATE.debounceTimer++;
                        if (STATE.debounceTimer > 3) STATE.stableFingerCount = fingers;
                    } else {
                        STATE.fingerCount = fingers; STATE.debounceTimer = 0;
                    }

                    if (STATE.currentStage === STAGE.INTRO) {
                        if (STATE.stableFingerCount >= 1 && STATE.stableFingerCount <= 5) {
                            countLabel.textContent = STATE.stableFingerCount; countLabel.style.opacity = 1;
                            if (STATE.stableFingerCount === 1) {
                                ringElement.classList.add('active'); STATE.summonTimer += 0.04; 
                                if (STATE.summonTimer > 2.0) {
                                    STATE.currentStage = STAGE.ROSE; setTargetShape('SolidRose');
                                    particleGroup.rotation.set(0, 0, 0); STATE.rotationVelocity = { x: 0, y: 0 };
                                    ringElement.classList.remove('active'); updateUI();
                                }
                            } else { STATE.summonTimer = 0; ringElement.classList.remove('active'); }
                        } else { countLabel.textContent = ""; STATE.summonTimer = 0; ringElement.classList.remove('active'); }
                    } else if (STATE.currentStage === STAGE.ROSE) {
                        ringElement.classList.remove('active');
                        const pinch = Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y, lm[4].z-lm[8].z);
                        if (pinch < CONFIG.pinchThresholdIn) {
                            STATE.gesture = 'PINCH'; const sensitivity = 0.0008;
                            STATE.rotationVelocity.x += (STATE.handPos.y - STATE.pinchStart.y) * sensitivity;
                            STATE.rotationVelocity.y += (STATE.handPos.x - STATE.pinchStart.x) * sensitivity;
                            STATE.pinchStart = {...STATE.handPos};
                        } else { STATE.pinchStart = {...STATE.handPos}; }
                        if (STATE.stableFingerCount >= 4) {
                            STATE.currentStage = STAGE.CHAOS;
                            for(let i=0; i<CONFIG.particleCount*3; i++) targetPositions[i] = chaosPositions[i]; 
                            updateUI();
                        }
                    } else if (STATE.currentStage === STAGE.CHAOS) {
                        if (STATE.stableFingerCount === 0) {
                            STATE.currentStage = STAGE.HEART; setTargetShape('CrystalHeart'); particleGroup.rotation.set(0, 0, 0); 
                            const posAttr = geometry.attributes.position;
                            for(let k = 0; k < CONFIG.particleCount; k++) {
                                if (k % 20 === 0) {
                                    const k3 = k * 3;
                                    posAttr.array[k3] = (Math.random() - 0.5) * 50;
                                    posAttr.array[k3+1] = 10 + Math.random() * 20;
                                    posAttr.array[k3+2] = (Math.random() - 0.5) * 50;
                                }
                            }
                            posAttr.needsUpdate = true; updateUI();
                        }
                    }
                    stateLabel.textContent = `STAGE: ${STATE.currentStage} | FINGERS: ${STATE.stableFingerCount}`;
                } else {
                    crosshair.style.opacity = 0;
                    if (STATE.currentStage === STAGE.INTRO) { countLabel.textContent = ""; STATE.summonTimer = 0; ringElement.classList.remove('active'); }
                    STATE.gesture = 'HOVER'; 
                }
            }
            requestAnimationFrame(predict);
        }

        const clock = new THREE.Clock(); const fpsEl = document.getElementById('fps-counter'); let frame = 0, lastF = 0;
        function animate() {
            requestAnimationFrame(animate); const delta = clock.getDelta(); STATE.time += delta;
            frame++; if (performance.now() - lastF > 1000) { fpsEl.textContent = `FPS: ${frame}`; frame=0; lastF=performance.now(); }

            const camX = Math.sin(STATE.time * 0.5) * 0.3; const camY = Math.cos(STATE.time * 0.3) * 0.2;
            camera.position.x += (camX - camera.position.x) * 0.05; camera.position.y += (camY - camera.position.y) * 0.05; camera.lookAt(0, 0, 0);

            if (STATE.currentStage === STAGE.INTRO) {
                particleGroup.rotation.y += 0.005 + STATE.summonTimer * 0.08; particleGroup.rotation.z += 0.002;
            } else if (STATE.currentStage === STAGE.ROSE) {
                STATE.rotationVelocity.x *= 0.92; STATE.rotationVelocity.y *= 0.92;
                particleGroup.rotation.x += STATE.rotationVelocity.x; particleGroup.rotation.y += STATE.rotationVelocity.y;
            } else if (STATE.currentStage === STAGE.HEART) { particleGroup.rotation.y += 0.005; }

            const posAttr = geometry.attributes.position; const colAttr = geometry.attributes.color;
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const i3 = i * 3;
                let tx = targetPositions[i3], ty = targetPositions[i3+1], tz = targetPositions[i3+2];
                let isFalling = false;

                if (STATE.currentStage === STAGE.HEART && i % 20 === 0) {
                    isFalling = true; const speed = 0.01 + randoms[i] * 0.015; 
                    posAttr.array[i3+1] -= speed; posAttr.array[i3] += Math.sin(STATE.time + i) * 0.01;
                    if (posAttr.array[i3+1] < -5) {
                        posAttr.array[i3+1] = 5; posAttr.array[i3] = (Math.random()-0.5) * 6; posAttr.array[i3+2] = (Math.random()-0.5) * 6;
                    }
                }

                if (!isFalling) {
                    if (STATE.currentStage === STAGE.INTRO && STATE.summonTimer > 0) {
                        const shake = STATE.summonTimer * 0.05;
                        posAttr.array[i3] += (Math.random()-0.5) * shake; posAttr.array[i3+1] += (Math.random()-0.5) * shake; posAttr.array[i3+2] += (Math.random()-0.5) * shake;
                    } else if (STATE.currentStage === STAGE.ROSE) {
                        const dx = tx - posAttr.array[i3], dy = ty - posAttr.array[i3+1], dz = tz - posAttr.array[i3+2];
                        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                        if (dist > 2.0) {
                            const swirlSpeed = 0.15;
                            posAttr.array[i3] += (dx * 0.06 - dz * swirlSpeed); posAttr.array[i3+1] += (dy * 0.06); posAttr.array[i3+2] += (dz * 0.06 + dx * swirlSpeed);
                        } else {
                            const breathe = Math.sin(STATE.time * 2 + randoms[i] * 6.28) * 0.01;
                            posAttr.array[i3] += dx * 0.12 + breathe; posAttr.array[i3+1] += dy * 0.12 + breathe; posAttr.array[i3+2] += dz * 0.12 + breathe;
                        }
                    } else if (STATE.currentStage === STAGE.CHAOS) {
                        tx = chaosPositions[i3]; ty = chaosPositions[i3+1]; tz = chaosPositions[i3+2];
                        posAttr.array[i3] += (tx - posAttr.array[i3]) * 0.01; posAttr.array[i3+1] += (ty - posAttr.array[i3+1]) * 0.01; posAttr.array[i3+2] += (tz - posAttr.array[i3+2]) * 0.01;
                    } else if (STATE.currentStage === STAGE.HEART) {
                        posAttr.array[i3] += (tx - posAttr.array[i3]) * 0.1; posAttr.array[i3+1] += (ty - posAttr.array[i3+1]) * 0.1; posAttr.array[i3+2] += (tz - posAttr.array[i3+2]) * 0.1;
                    } else {
                        posAttr.array[i3] += (tx - posAttr.array[i3]) * 0.05; posAttr.array[i3+1] += (ty - posAttr.array[i3+1]) * 0.05; posAttr.array[i3+2] += (tz - posAttr.array[i3+2]) * 0.05;
                    }
                }

                if (STATE.currentStage === STAGE.INTRO) {
                     const f = Math.min(STATE.summonTimer / 2.0, 1.0); 
                     colAttr.array[i3] = 0.0*(1-f) + 1.0*f; colAttr.array[i3+1] = 0.5*(1-f); colAttr.array[i3+2] = 0.8*(1-f) + 0.2*f;
                } else if (STATE.currentStage === STAGE.ROSE || STATE.currentStage === STAGE.CHAOS) {
                    const leafL = CONFIG.particleCount * 0.25, calyxL = CONFIG.particleCount * 0.30;
                    const glitter = Math.sin(STATE.time * 4 + i) > 0.92 ? 0.3 : 0.0;
                    if (i < leafL) { colAttr.array[i3] = 0.02 + glitter; colAttr.array[i3+1] = 0.18 + glitter; colAttr.array[i3+2] = 0.02 + glitter; }
                    else if (i < calyxL) { colAttr.array[i3] = 0.05; colAttr.array[i3+1] = 0.25; colAttr.array[i3+2] = 0.05; }
                    else {
                        const t = (i - calyxL) / (CONFIG.particleCount - calyxL);
                        let r = 0.2 + Math.pow(t, 0.6) * 0.6, g = 0.01, b = 0.05 + t * 0.05;
                        if (t < 0.25) { r *= 0.4; b *= 0.5; }
                        const sheen = randoms[i] * 0.15;
                        colAttr.array[i3] = Math.min(1.0, r + sheen + glitter); colAttr.array[i3+1] = g + glitter; colAttr.array[i3+2] = b + glitter;
                    }
                } else if (STATE.currentStage === STAGE.HEART) {
                    if (isFalling) { colAttr.array[i3] = 1.0; colAttr.array[i3+1] = 0.8; colAttr.array[i3+2] = 0.9; }
                    else if (i < CONFIG.particleCount * 0.1) {
                        const dist = Math.sqrt(targetPositions[i3]*targetPositions[i3] + targetPositions[i3+2]*targetPositions[i3+2]);
                        const ripple = Math.sin(dist * 5.0 - STATE.time * 3.0);
                        colAttr.array[i3] = 0.0; colAttr.array[i3+1] = 0.5 + ripple * 0.3; colAttr.array[i3+2] = 1.0;
                    } else {
                        const ny = Math.max(0, Math.min(1, (posAttr.array[i3+1]) / 3.0));
                        const twinkle = Math.sin(STATE.time * 10 + i * 0.5) > 0.9;
                        if (twinkle) { colAttr.array[i3]=1.0; colAttr.array[i3+1]=1.0; colAttr.array[i3+2]=1.0; }
                        else { colAttr.array[i3] = 0.1 * ny; colAttr.array[i3+1] = 0.3 * ny + 0.2; colAttr.array[i3+2] = 0.8 + 0.2 * ny; }
                    }
                }
            }
            posAttr.needsUpdate = true; colAttr.needsUpdate = true;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        setupVision(); animate();
    </script>
